# VTK for a vcpkg triplet (build.py vtk) from vcpkg's binary cache, for build.yml's natives job. A cold cache builds VTK,
# which takes 15 to 20 minutes per triplet.
name: VTK
description: vcpkg at the registry baseline, its binary cache and VTK for a triplet (build.py vtk)

inputs:
  triplet:
    description: the vcpkg triplet
    required: true
  save-cache:
    description: "true: save the binary cache when the install changed it"
    default: "false"

runs:
  using: composite
  steps:
    # at the registry baseline of vcpkg-configuration.json: the tool's scripts match the ports
    - name: vcpkg
      shell: bash
      working-directory: netvtk-core
      env:
        VCPKG_ROOT: ${{ github.workspace }}/.vcpkg-tool
      run: |
        commit=$(jq -r '."default-registry".baseline' vcpkg-configuration.json)
        git init --quiet "$VCPKG_ROOT"
        git -C "$VCPKG_ROOT" fetch --quiet --depth 1 https://github.com/microsoft/vcpkg.git "$commit"
        git -C "$VCPKG_ROOT" checkout --quiet FETCH_HEAD
        if [ "$RUNNER_OS" = "Windows" ]; then "$VCPKG_ROOT/bootstrap-vcpkg.bat" -disableMetrics; else "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics; fi

    # vcpkg's binary cache, saved under a new key whenever the archives changed; a restore takes the newest. The ABIs
    # also cover the runner image (compiler, CMake), so vcpkg can rebuild without a change here: --prune-archives then
    # drops the stale archives. Saved right after VTK, so a failing test later doesn't throw the build away.
    - id: cache
      uses: actions/cache/restore@v6
      with:
        path: netvtk-core/.vcpkg/archives
        key: vcpkg-${{ inputs.triplet }}-${{ hashFiles('netvtk-core/vcpkg.json', 'netvtk-core/vcpkg-configuration.json', 'netvtk-core/vcpkg/ports/**', format('netvtk-core/vcpkg/triplets/{0}.cmake', inputs.triplet)) }}-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: |
          vcpkg-${{ inputs.triplet }}-${{ hashFiles('netvtk-core/vcpkg.json', 'netvtk-core/vcpkg-configuration.json', 'netvtk-core/vcpkg/ports/**', format('netvtk-core/vcpkg/triplets/{0}.cmake', inputs.triplet)) }}-
          vcpkg-${{ inputs.triplet }}-

    - id: vtk
      name: VTK
      shell: bash
      working-directory: netvtk-core
      env:
        VCPKG_ROOT: ${{ github.workspace }}/.vcpkg-tool
      run: python build.py vtk --triplet ${{ inputs.triplet }} ${{ inputs.save-cache == 'true' && '--prune-archives' || '' }}

    - if: inputs.save-cache == 'true' && steps.vtk.outputs.archives-changed == 'true'
      uses: actions/cache/save@v6
      with:
        path: netvtk-core/.vcpkg/archives
        key: ${{ steps.cache.outputs.cache-primary-key }}
