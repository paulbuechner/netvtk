# netvtk-generator: build and test netvtk-gen, unit tests plus the golden tests (the whole pipeline over a fake VTK install
# in test/.../Golden, no VTK needed). Running on all three OSes also checks that the generated output doesn't depend on
# the host.
name: generator

on:
  push:
    branches: [main, next]
  pull_request:
    paths: ["netvtk-generator/**", ".github/workflows/generator.yml"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

defaults:
  run:
    working-directory: netvtk-generator

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - run: dotnet build NetVtk.Generator.slnx -c Release
      - run: dotnet test NetVtk.Generator.slnx -c Release --no-build
