<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 800 336" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="building-steps-title building-steps-desc" width="800" height="336">
        <title id="building-steps-title">netvtk-core's build steps</title>
        <desc id="building-steps-desc">build.py's steps in order: tools installs SWIG, vtk builds VTK 9.7.1 through vcpkg, generate runs SWIG over the committed modules, native builds NetVtk's and VTK's libraries, then test on every framework and docs writes NetVtk.xml through netvtk-gen, and pack makes the .nupkg files; netvtk-gen generate writes the committed SWIG modules from VTK's install, only after a change to the generator or its configuration.</desc>
        <defs><style>@font-face{font-family:'Geist';font-weight:600;font-style:normal;src:url(data:font/woff;base64,) format('woff')}
@font-face{font-family:'Geist Mono';font-weight:400;font-style:normal;src:url(data:font/woff;base64,) format('woff')}</style><clipPath id="netvtk-card"><rect width="800" height="336" rx="12"/></clipPath>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        </defs><g clip-path="url(#netvtk-card)">
        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- Connectors, before the boxes: test and docs both run on the natives, pack after both. -->
        <g fill="none" stroke="#4f5d75" stroke-width="1.2">
          <path d="M140,112 H162" marker-end="url(#arrow)"/>
          <path d="M264,112 H286" marker-end="url(#arrow)"/>
          <path d="M388,112 H410" marker-end="url(#arrow)"/>
          <path d="M512,92 H534" marker-end="url(#arrow)"/>
          <path d="M512,132 H534" marker-end="url(#arrow)"/>
          <path d="M636,92 H658" marker-end="url(#arrow)"/>
          <path d="M636,132 H658" marker-end="url(#arrow)"/>
          <!-- The generator's side path, dashed: only after a change to it. -->
          <path d="M214,144 V230" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
          <path d="M338,232 V146" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        </g>

        <!-- Labels beside the vertical segments. -->
        <g fill="#f5f5f5">
          <rect x="128" y="180" width="78" height="12" rx="2"/>
          <rect x="346" y="180" width="72" height="12" rx="2"/>
        </g>
        <g font-family="'Geist Mono', monospace" font-size="8" fill="#5a6580" letter-spacing="0.06em">
          <text x="202" y="189" text-anchor="end">VTK'S INSTALL</text>
          <text x="350" y="189">SWIG MODULES</text>
        </g>

        <g font-family="'Geist', sans-serif" font-size="12" font-weight="600" fill="#2d3142" text-anchor="middle">
          <rect x="40" y="80" width="100" height="64" rx="6" fill="#ffffff" stroke="#2d3142"/>
          <text x="90" y="104">tools</text>
          <rect x="164" y="80" width="100" height="64" rx="6" fill="#ffffff" stroke="#2d3142"/>
          <text x="214" y="104">vtk</text>
          <rect x="288" y="80" width="100" height="64" rx="6" fill="#ffffff" stroke="#2d3142"/>
          <text x="338" y="104">generate</text>
          <rect x="412" y="80" width="100" height="64" rx="6" fill="#ffffff" stroke="#2d3142"/>
          <text x="462" y="104">native</text>
          <rect x="536" y="40" width="100" height="64" rx="6" fill="#ffffff" stroke="#2d3142"/>
          <text x="586" y="64">test</text>
          <rect x="536" y="120" width="100" height="64" rx="6" fill="#ffffff" stroke="#2d3142"/>
          <text x="586" y="144">docs</text>
          <rect x="660" y="80" width="100" height="64" rx="6" fill="#ffffff" stroke="#2d3142"/>
          <text x="710" y="104">pack</text>

          <!-- netvtk-generator: optional. -->
          <rect x="164" y="232" width="224" height="64" rx="6" fill="#f5f5f5"/>
          <rect x="164" y="232" width="224" height="64" rx="6" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.20)" stroke-dasharray="4,3"/>
          <text x="276" y="256">netvtk-gen generate</text>
        </g>
        <g font-family="'Geist Mono', monospace" font-size="9" fill="#4f5d75" text-anchor="middle">
          <text x="90" y="120">SWIG</text>
          <text x="214" y="120">VTK 9.7.1</text>
          <text x="214" y="132">via vcpkg</text>
          <text x="338" y="120">SWIG over</text>
          <text x="338" y="132">the modules</text>
          <text x="462" y="120">NetVtk* and</text>
          <text x="462" y="132">VTK's libraries</text>
          <text x="586" y="80">every</text>
          <text x="586" y="92">framework</text>
          <text x="586" y="160">NetVtk.xml,</text>
          <text x="586" y="172">via netvtk-gen</text>
          <text x="710" y="120">.nupkg</text>
          <text x="276" y="272">only after a change to the</text>
          <text x="276" y="284">generator or its config</text>
        </g>
      </g></svg>
