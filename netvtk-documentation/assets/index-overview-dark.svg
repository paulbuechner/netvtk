<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 800 556" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="index-overview-title index-overview-desc" width="800" height="556">
        <title id="index-overview-title">NetVtk at a glance</title>
        <desc id="index-overview-desc">An app calls one assembly, NetVtk.dll, with VTK's classes in the namespace Vtk; it calls five native libraries wrapping 25 VTK modules (Common 6, Filters 5, IO 5, Rendering 7, Interaction 2) and NetVtkRuntime, which they share; they call VTK 9.7.1, whose 77 libraries on Windows come in the same per-platform package, NetVtk.runtime.&lt;rid&gt;.</desc>
        <defs><style>@font-face{font-family:'Geist';font-weight:600;font-style:normal;src:url(data:font/woff;base64,) format('woff')}
@font-face{font-family:'Geist Mono';font-weight:400;font-style:normal;src:url(data:font/woff;base64,) format('woff')}</style><clipPath id="netvtk-card"><rect width="800" height="556" rx="12"/></clipPath>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#a6a6a6"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#f08a59"/></marker>
        </defs><g clip-path="url(#netvtk-card)">
        <rect width="100%" height="100%" fill="#171717"/>

        <!-- Zone first: the native libraries. -->
        <rect x="40" y="160" width="720" height="232" rx="8" fill="rgba(230,230,230,0.06)" stroke="rgba(230,230,230,0.20)"/>
        <text x="60" y="182" fill="#8c8c8c" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">NATIVE · PACKAGE NetVtk.runtime.&lt;rid&gt;, ONE PER PLATFORM</text>

        <!-- Connectors, before the boxes. -->
        <path d="M216,76 H262" fill="none" stroke="#a6a6a6" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M512,112 V158" fill="none" stroke="#f08a59" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
        <path d="M512,392 V438" fill="none" stroke="#a6a6a6" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="524" y="128" width="52" height="12" rx="2" fill="#171717"/>
        <text x="528" y="137" fill="#f08a59" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">P/INVOKE</text>
        <rect x="524" y="408" width="40" height="12" rx="2" fill="#171717"/>
        <text x="528" y="417" fill="#8c8c8c" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">CALLS</text>

        <!-- The app and the assembly (focal). -->
        <rect x="40" y="40" width="176" height="72" rx="6" fill="#171717"/>
        <rect x="40" y="40" width="176" height="72" rx="6" fill="rgba(166,166,166,0.18)" stroke="#8c8c8c"/>
        <text x="128" y="72" fill="#e6e6e6" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">your app</text>
        <text x="128" y="89" fill="#a6a6a6" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">C#, AnyCPU</text>

        <rect x="264" y="40" width="496" height="72" rx="6" fill="#171717"/>
        <rect x="264" y="40" width="496" height="72" rx="6" fill="rgba(240,138,89,0.13)" stroke="#f08a59"/>
        <text x="512" y="64" fill="#e6e6e6" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">NetVtk.dll</text>
        <text x="512" y="82" fill="#a6a6a6" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">package NetVtk · one namespace, Vtk: VTK's class names unchanged</text>
        <text x="512" y="96" fill="#a6a6a6" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">.NET Framework 3.5, 4.5+ · .NET 6, 8, 10 · netstandard2.0</text>

        <!-- The six native libraries; the chips count VTK modules. -->
        <g font-family="'Geist', sans-serif">
          <rect x="60" y="196" width="216" height="80" rx="6" fill="#1f1f1f" stroke="#e6e6e6"/>
          <text x="76" y="224" fill="#e6e6e6" font-size="12" font-weight="600">NetVtkCommon</text>
          <rect x="228" y="212" width="32" height="16" rx="2" fill="none" stroke="rgba(230,230,230,0.48)" stroke-width="0.8"/>
          <text x="244" y="223" fill="#a6a6a6" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">6</text>
          <text x="76" y="246" fill="#a6a6a6" font-size="9" font-family="'Geist Mono', monospace">objects, events, data arrays,</text>
          <text x="76" y="260" fill="#a6a6a6" font-size="9" font-family="'Geist Mono', monospace">data sets, the pipeline</text>

          <rect x="292" y="196" width="216" height="80" rx="6" fill="#1f1f1f" stroke="#e6e6e6"/>
          <text x="308" y="224" fill="#e6e6e6" font-size="12" font-weight="600">NetVtkFilters</text>
          <rect x="460" y="212" width="32" height="16" rx="2" fill="none" stroke="rgba(230,230,230,0.48)" stroke-width="0.8"/>
          <text x="476" y="223" fill="#a6a6a6" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">5</text>
          <text x="308" y="246" fill="#a6a6a6" font-size="9" font-family="'Geist Mono', monospace">core, general, geometry,</text>
          <text x="308" y="260" fill="#a6a6a6" font-size="9" font-family="'Geist Mono', monospace">modeling and source filters</text>

          <rect x="524" y="196" width="216" height="80" rx="6" fill="#1f1f1f" stroke="#e6e6e6"/>
          <text x="540" y="224" fill="#e6e6e6" font-size="12" font-weight="600">NetVtkIO</text>
          <rect x="692" y="212" width="32" height="16" rx="2" fill="none" stroke="rgba(230,230,230,0.48)" stroke-width="0.8"/>
          <text x="708" y="223" fill="#a6a6a6" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">5</text>
          <text x="540" y="246" fill="#a6a6a6" font-size="9" font-family="'Geist Mono', monospace">VTK's XML and legacy files,</text>
          <text x="540" y="260" fill="#a6a6a6" font-size="9" font-family="'Geist Mono', monospace">Exodus II, CGNS</text>

          <rect x="60" y="292" width="216" height="80" rx="6" fill="#1f1f1f" stroke="#e6e6e6"/>
          <text x="76" y="320" fill="#e6e6e6" font-size="12" font-weight="600">NetVtkRendering</text>
          <rect x="228" y="308" width="32" height="16" rx="2" fill="none" stroke="rgba(230,230,230,0.48)" stroke-width="0.8"/>
          <text x="244" y="319" fill="#a6a6a6" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">7</text>
          <text x="76" y="342" fill="#a6a6a6" font-size="9" font-family="'Geist Mono', monospace">OpenGL rendering, annotations,</text>
          <text x="76" y="356" fill="#a6a6a6" font-size="9" font-family="'Geist Mono', monospace">text, volumes</text>

          <rect x="292" y="292" width="216" height="80" rx="6" fill="#1f1f1f" stroke="#e6e6e6"/>
          <text x="308" y="320" fill="#e6e6e6" font-size="12" font-weight="600">NetVtkInteraction</text>
          <rect x="460" y="308" width="32" height="16" rx="2" fill="none" stroke="rgba(230,230,230,0.48)" stroke-width="0.8"/>
          <text x="476" y="319" fill="#a6a6a6" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">2</text>
          <text x="308" y="342" fill="#a6a6a6" font-size="9" font-family="'Geist Mono', monospace">interaction styles</text>
          <text x="308" y="356" fill="#a6a6a6" font-size="9" font-family="'Geist Mono', monospace">and widgets</text>

          <rect x="524" y="292" width="216" height="80" rx="6" fill="#171717"/>
          <rect x="524" y="292" width="216" height="80" rx="6" fill="rgba(230,230,230,0.10)" stroke="#a6a6a6"/>
          <text x="540" y="320" fill="#e6e6e6" font-size="12" font-weight="600">NetVtkRuntime</text>
          <text x="540" y="342" fill="#a6a6a6" font-size="9" font-family="'Geist Mono', monospace">what the others share: exceptions</text>
          <text x="540" y="356" fill="#a6a6a6" font-size="9" font-family="'Geist Mono', monospace">from callbacks, memory streams</text>
        </g>

        <!-- VTK. -->
        <rect x="40" y="440" width="720" height="56" rx="6" fill="#171717"/>
        <rect x="40" y="440" width="720" height="56" rx="6" fill="rgba(230,230,230,0.10)" stroke="#a6a6a6"/>
        <text x="400" y="464" fill="#e6e6e6" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">VTK 9.7.1</text>
        <text x="400" y="481" fill="#a6a6a6" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">its libraries, 77 on Windows, beside NetVtk's in runtimes/&lt;rid&gt;/native</text>

        <text x="40" y="524" fill="#8c8c8c" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">THE NUMBERS: VTK MODULES PER LIBRARY, 25 IN ALL</text>
      </g></svg>
