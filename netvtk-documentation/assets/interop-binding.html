<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A binding on NetVtk</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Geist', system-ui, sans-serif; background: #f5f5f5; color: #2d3142; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow { font-family: 'Geist Mono', ui-monospace, monospace; font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: #4f5d75; margin-bottom: 0.5rem; }
    h1 { font-family: 'Instrument Serif', serif; font-size: 2rem; font-weight: 400; letter-spacing: -0.02em; line-height: 1.15; margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 800px; display: block; }
    @media print { .diagram-container { overflow-x: visible; } svg { min-width: 0; } }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · interop.md</p>
    <h1>A binding on NetVtk</h1>
    <div class="diagram-container">
      <svg viewBox="0 0 800 484" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="interop-binding-title interop-binding-desc">
        <title id="interop-binding-title">A binding on NetVtk</title>
        <desc id="interop-binding-desc">Your binding's .i files include NetVtkInterop.i from the NetVtk package rather than NetVtk's typemap library; its assembly builds on NetVtk.dll's proxies through %netvtk_object and %netvtk_derived; its native library, built against your VTK build, runs on NetVtk's VTK 9.7.1; your VTK build is pinned to NetVtk's vcpkg registry at a release, with its triplets and features, which gives the same VTK build.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
        </defs>
        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- Column heads. -->
        <g font-family="'Geist Mono', monospace" font-size="8" letter-spacing="0.14em" fill="#5a6580">
          <text x="40" y="52">YOUR BINDING</text>
          <text x="456" y="52">NETVTK</text>
        </g>

        <!-- Connectors, before the boxes: each row's part of your binding builds on NetVtk's. -->
        <path d="M344,100 H454" fill="none" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <g fill="none" stroke="#4f5d75" stroke-width="1.2">
          <path d="M344,188 H454" marker-end="url(#arrow)"/>
          <path d="M344,276 H454" marker-end="url(#arrow)"/>
          <path d="M344,380 H454" marker-end="url(#arrow)"/>
          <path d="M192,308 V346" marker-end="url(#arrow)"/>
        </g>
        <g font-family="'Geist Mono', monospace" font-size="8" letter-spacing="0.06em">
          <rect x="374" y="80" width="52" height="12" rx="2" fill="#f5f5f5"/>
          <text x="400" y="89" fill="#bf4520" text-anchor="middle">%INCLUDE</text>
          <rect x="372" y="168" width="56" height="12" rx="2" fill="#f5f5f5"/>
          <text x="400" y="177" fill="#5a6580" text-anchor="middle">BUILDS ON</text>
          <rect x="376" y="256" width="48" height="12" rx="2" fill="#f5f5f5"/>
          <text x="400" y="265" fill="#5a6580" text-anchor="middle">RUNS ON</text>
          <rect x="380" y="360" width="40" height="12" rx="2" fill="#f5f5f5"/>
          <text x="400" y="369" fill="#5a6580" text-anchor="middle">PINNED</text>
          <rect x="200" y="321" width="80" height="12" rx="2" fill="#f5f5f5"/>
          <text x="204" y="330" fill="#5a6580">BUILT AGAINST</text>
        </g>

        <!-- Your binding. -->
        <g font-family="'Geist', sans-serif" text-anchor="middle">
          <rect x="40" y="68" width="304" height="64" rx="6" fill="#f5f5f5"/>
          <rect x="40" y="68" width="304" height="64" rx="6" fill="rgba(79,93,117,0.10)" stroke="#5a6580"/>
          <text x="192" y="96" fill="#2d3142" font-size="12" font-weight="600">your .i files</text>
          <text x="192" y="113" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">not NetVtk's typemap library, swig/common/</text>

          <rect x="40" y="156" width="304" height="64" rx="6" fill="#f5f5f5"/>
          <rect x="40" y="156" width="304" height="64" rx="6" fill="rgba(79,93,117,0.10)" stroke="#5a6580"/>
          <text x="192" y="178" fill="#2d3142" font-size="12" font-weight="600">your assembly</text>
          <text x="192" y="195" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">%netvtk_object: NetVtk's objects in signatures</text>
          <text x="192" y="209" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">%netvtk_derived: subclasses of its proxies</text>

          <rect x="40" y="244" width="304" height="64" rx="6" fill="#f5f5f5"/>
          <rect x="40" y="244" width="304" height="64" rx="6" fill="rgba(79,93,117,0.10)" stroke="#5a6580"/>
          <text x="192" y="272" fill="#2d3142" font-size="12" font-weight="600">your native library</text>
          <text x="192" y="289" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">the wrappers, compiled against VTK's headers</text>

          <rect x="40" y="348" width="304" height="64" rx="6" fill="#f5f5f5"/>
          <rect x="40" y="348" width="304" height="64" rx="6" fill="rgba(79,93,117,0.10)" stroke="#5a6580"/>
          <text x="192" y="376" fill="#2d3142" font-size="12" font-weight="600">your VTK build</text>
          <text x="192" y="393" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">vcpkg, with NetVtk's triplets and features</text>
        </g>

        <!-- NetVtk; the interop file is focal. -->
        <g font-family="'Geist', sans-serif" text-anchor="middle">
          <rect x="456" y="68" width="304" height="64" rx="6" fill="#f5f5f5"/>
          <rect x="456" y="68" width="304" height="64" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520"/>
          <text x="608" y="96" fill="#2d3142" font-size="12" font-weight="600">NetVtkInterop.i</text>
          <text x="608" y="113" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">swig/interop/ in the NetVtk package</text>

          <rect x="456" y="156" width="304" height="64" rx="6" fill="#ffffff" stroke="#2d3142"/>
          <text x="608" y="178" fill="#2d3142" font-size="12" font-weight="600">NetVtk.dll</text>
          <text x="608" y="195" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">NativePointer in, FromNativePointer out</text>
          <text x="608" y="209" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">protected internal (IntPtr, bool) constructors</text>

          <rect x="456" y="244" width="304" height="64" rx="6" fill="#f5f5f5"/>
          <rect x="456" y="244" width="304" height="64" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75"/>
          <text x="608" y="272" fill="#2d3142" font-size="12" font-weight="600">VTK 9.7.1</text>
          <text x="608" y="289" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">NetVtk's build, in NetVtk.runtime.&lt;rid&gt;</text>

          <rect x="456" y="348" width="304" height="64" rx="6" fill="#f5f5f5"/>
          <rect x="456" y="348" width="304" height="64" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75"/>
          <text x="608" y="376" fill="#2d3142" font-size="12" font-weight="600">vcpkg registry</text>
          <text x="608" y="393" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">versions/ in NetVtk's repository: VTK's port</text>
        </g>

        <text x="40" y="444" fill="#5a6580" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">PINNED AT A NETVTK RELEASE, WITH ITS TRIPLETS AND FEATURES: THE SAME VTK BUILD</text>
      </svg>
    </div>
  </div>
</body>
</html>
