<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 800 380" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="lifetimes-references-title lifetimes-references-desc" width="800" height="380">
        <title id="lifetimes-references-title">One reference per proxy</title>
        <desc id="lifetimes-references-desc">Two C# proxies of a vtkPoints, one from new vtkPoints() and one from GetPoints(), each hold one reference on it, and a vtkPolyData holds one of its own, so its reference count is 3; Dispose or the finalizer drops a proxy's reference, and VTK frees the object when its count reaches zero.</desc>
        <defs><style>@font-face{font-family:'Geist';font-weight:600;font-style:normal;src:url(data:font/woff;base64,) format('woff')}
@font-face{font-family:'Geist Mono';font-weight:400;font-style:normal;src:url(data:font/woff;base64,) format('woff')}</style><clipPath id="netvtk-card"><rect width="800" height="380" rx="12"/></clipPath>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        </defs><g clip-path="url(#netvtk-card)">
        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- Zones: the two heaps. -->
        <rect x="40" y="40" width="288" height="272" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <text x="56" y="53" fill="#5a6580" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">.NET HEAP</text>
        <rect x="472" y="40" width="288" height="272" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <text x="488" y="53" fill="#5a6580" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">NATIVE HEAP</text>

        <!-- Connectors, before the boxes: each is one reference. -->
        <g fill="none" stroke="#4f5d75" stroke-width="1.2">
          <path d="M304,96 H494" marker-end="url(#arrow)"/>
          <path d="M304,168 H494" marker-end="url(#arrow)"/>
          <path d="M304,264 H494" marker-end="url(#arrow)"/>
          <path d="M616,240 V194" marker-end="url(#arrow)"/>
        </g>
        <g font-family="'Geist Mono', monospace" font-size="8" letter-spacing="0.06em" fill="#5a6580">
          <rect x="356" y="76" width="88" height="12" rx="2" fill="#f5f5f5"/>
          <text x="400" y="85" text-anchor="middle">ONE REFERENCE</text>
          <rect x="356" y="148" width="88" height="12" rx="2" fill="#f5f5f5"/>
          <text x="400" y="157" text-anchor="middle">ONE REFERENCE</text>
          <rect x="356" y="244" width="88" height="12" rx="2" fill="#f5f5f5"/>
          <text x="400" y="253" text-anchor="middle">ONE REFERENCE</text>
          <rect x="624" y="211" width="88" height="12" rx="2" fill="#f1f1f1"/>
          <text x="628" y="220">ONE OF ITS OWN</text>
        </g>

        <!-- Proxies: where each one's reference came from. -->
        <g font-family="'Geist', sans-serif" text-anchor="middle">
          <rect x="64" y="72" width="240" height="48" rx="6" fill="#ffffff" stroke="#2d3142"/>
          <text x="184" y="93" fill="#2d3142" font-size="12" font-weight="600">vtkPoints proxy</text>
          <text x="184" y="108" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">new vtkPoints()</text>

          <rect x="64" y="144" width="240" height="48" rx="6" fill="#ffffff" stroke="#2d3142"/>
          <text x="184" y="165" fill="#2d3142" font-size="12" font-weight="600">another vtkPoints proxy</text>
          <text x="184" y="180" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">polyData.GetPoints()</text>

          <rect x="64" y="240" width="240" height="48" rx="6" fill="#ffffff" stroke="#2d3142"/>
          <text x="184" y="261" fill="#2d3142" font-size="12" font-weight="600">vtkPolyData proxy</text>
          <text x="184" y="276" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">new vtkPolyData()</text>
        </g>

        <!-- VTK's objects; the counted vtkPoints is focal. -->
        <g font-family="'Geist', sans-serif" text-anchor="middle">
          <rect x="496" y="72" width="240" height="120" rx="6" fill="#f5f5f5"/>
          <rect x="496" y="72" width="240" height="120" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520"/>
          <text x="616" y="129" fill="#2d3142" font-size="12" font-weight="600">vtkPoints</text>
          <text x="616" y="145" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">reference count 3</text>

          <rect x="496" y="240" width="240" height="48" rx="6" fill="#ffffff" stroke="#2d3142"/>
          <text x="616" y="268" fill="#2d3142" font-size="12" font-weight="600">vtkPolyData</text>
        </g>

        <text x="40" y="340" fill="#5a6580" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">DISPOSE OR THE FINALIZER DROPS A PROXY'S REFERENCE · AT ZERO, VTK FREES THE OBJECT</text>
      </g></svg>
