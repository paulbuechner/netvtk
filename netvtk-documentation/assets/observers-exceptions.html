<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A handler's exception comes back from the call</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Geist', system-ui, sans-serif; background: #f5f5f5; color: #2d3142; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow { font-family: 'Geist Mono', ui-monospace, monospace; font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: #4f5d75; margin-bottom: 0.5rem; }
    h1 { font-family: 'Instrument Serif', serif; font-size: 2rem; font-weight: 400; letter-spacing: -0.02em; line-height: 1.15; margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 800px; display: block; }
    @media print { .diagram-container { overflow-x: visible; } svg { min-width: 0; } }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Sequence · observers.md</p>
    <h1>A handler's exception comes back from the call</h1>
    <div class="diagram-container">
      <svg viewBox="0 0 800 632" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="observers-exceptions-title observers-exceptions-desc">
        <title id="observers-exceptions-title">A handler's exception comes back from the call</title>
        <desc id="observers-exceptions-desc">array.Modified() goes through the wrapped call into VTK, which invokes ModifiedEvent; SWIG's director calls the C# handler, which throws; the callback catches and parks the exception and returns, VTK goes on and returns, and the wrapped call throws a VtkException whose InnerException is the handler's.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
        </defs>
        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- Lifelines: your code 96, wrapped call 296, VTK 436, callback 576, your handler 704. -->
        <g stroke="rgba(45,49,66,0.22)" stroke-width="1" stroke-dasharray="3,3">
          <line x1="96" y1="96" x2="96" y2="560"/>
          <line x1="296" y1="96" x2="296" y2="560"/>
          <line x1="436" y1="96" x2="436" y2="560"/>
          <line x1="576" y1="96" x2="576" y2="560"/>
          <line x1="704" y1="96" x2="704" y2="560"/>
        </g>

        <!-- Activation bars. -->
        <g fill="#f5f5f5">
          <rect x="292" y="144" width="8" height="392"/>
          <rect x="432" y="192" width="8" height="264"/>
          <rect x="572" y="240" width="8" height="176"/>
          <rect x="700" y="280" width="8" height="40"/>
        </g>
        <g fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8">
          <rect x="292" y="144" width="8" height="392"/>
          <rect x="432" y="192" width="8" height="264"/>
          <rect x="572" y="240" width="8" height="176"/>
          <rect x="700" y="280" width="8" height="40"/>
        </g>

        <!-- Calls solid, returns and throws dashed; the throw that reaches your code is accent. -->
        <g fill="none" stroke-width="1.2">
          <path d="M96,144 H290" stroke="#4f5d75" marker-end="url(#arrow)"/>
          <path d="M300,192 H430" stroke="#4f5d75" marker-end="url(#arrow)"/>
          <path d="M440,240 H570" stroke="#4f5d75" marker-end="url(#arrow)"/>
          <path d="M580,280 H698" stroke="#4f5d75" marker-end="url(#arrow)"/>
          <path d="M700,320 H582" stroke="#4f5d75" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
          <path d="M580,344 H596 Q604,344 604,352 V360 Q604,368 596,368 H582" stroke="#4f5d75" marker-end="url(#arrow)"/>
          <path d="M572,416 H442" stroke="#4f5d75" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
          <path d="M432,456 H302" stroke="#4f5d75" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
          <path d="M292,536 H98" stroke="#bf4520" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#arrow-accent)"/>
        </g>

        <!-- Message labels on paper masks: code verbatim, prose in caps. -->
        <g fill="#f5f5f5">
          <rect x="144" y="124" width="100" height="12" rx="2"/>
          <rect x="334" y="172" width="64" height="12" rx="2"/>
          <rect x="464" y="208" width="84" height="24" rx="2"/>
          <rect x="602" y="260" width="76" height="12" rx="2"/>
          <rect x="618" y="300" width="44" height="12" rx="2"/>
          <rect x="612" y="350" width="84" height="12" rx="2"/>
          <rect x="470" y="384" width="72" height="24" rx="2"/>
          <rect x="108" y="492" width="172" height="36" rx="2"/>
        </g>
        <g font-family="'Geist Mono', monospace" font-size="9" fill="#4f5d75" text-anchor="middle">
          <text x="194" y="133">array.Modified()</text>
          <text x="366" y="181">Modified()</text>
          <text x="506" y="228">ModifiedEvent</text>
          <text x="640" y="269">Execute(...)</text>
          <text x="194" y="513" fill="#bf4520">VtkException</text>
          <text x="194" y="525">InnerException: the handler's</text>
        </g>
        <g font-family="'Geist Mono', monospace" font-size="8" fill="#5a6580" letter-spacing="0.06em" text-anchor="middle">
          <text x="506" y="217">INVOKES</text>
          <text x="640" y="309">THROWS</text>
          <text x="616" y="359" text-anchor="start">CATCHES, PARKS</text>
          <text x="506" y="393">RETURNS,</text>
          <text x="506" y="404">VTK GOES ON</text>
          <text x="194" y="501" fill="#bf4520">THROWS</text>
        </g>

        <!-- Participants; the callback, where the exception stops, is focal. -->
        <g font-family="'Geist', sans-serif" text-anchor="middle">
          <rect x="40" y="40" width="112" height="56" rx="6" fill="#f5f5f5"/>
          <rect x="40" y="40" width="112" height="56" rx="6" fill="rgba(79,93,117,0.10)" stroke="#5a6580"/>
          <text x="96" y="64" fill="#2d3142" font-size="12" font-weight="600">your code</text>
          <text x="96" y="80" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">application · C#</text>

          <rect x="236" y="40" width="120" height="56" rx="6" fill="#ffffff" stroke="#2d3142"/>
          <text x="296" y="64" fill="#2d3142" font-size="12" font-weight="600">wrapped call</text>
          <text x="296" y="80" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">NetVtk · C#, C++</text>

          <rect x="384" y="40" width="104" height="56" rx="6" fill="#f5f5f5"/>
          <rect x="384" y="40" width="104" height="56" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)"/>
          <text x="436" y="64" fill="#2d3142" font-size="12" font-weight="600">VTK</text>
          <text x="436" y="80" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">vtkObject · C++</text>

          <rect x="516" y="40" width="120" height="56" rx="6" fill="#f5f5f5"/>
          <rect x="516" y="40" width="120" height="56" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520"/>
          <text x="576" y="64" fill="#2d3142" font-size="12" font-weight="600">callback</text>
          <text x="576" y="80" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">SWIG's director</text>

          <rect x="648" y="40" width="112" height="56" rx="6" fill="#f5f5f5"/>
          <rect x="648" y="40" width="112" height="56" rx="6" fill="rgba(79,93,117,0.10)" stroke="#5a6580"/>
          <text x="704" y="64" fill="#2d3142" font-size="12" font-weight="600">your handler</text>
          <text x="704" y="80" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">observer · C#</text>
        </g>

        <text x="40" y="592" fill="#5a6580" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">PARKED: THE EXCEPTION IN C#, ITS NUMBER IN NETVTKRUNTIME, PER THREAD, UNTIL THE WRAPPED CALL RETURNS</text>
      </svg>
    </div>
  </div>
</body>
</html>
