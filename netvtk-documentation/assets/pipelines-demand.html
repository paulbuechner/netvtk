<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nothing runs until asked</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Geist', system-ui, sans-serif; background: #f5f5f5; color: #2d3142; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow { font-family: 'Geist Mono', ui-monospace, monospace; font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: #4f5d75; margin-bottom: 0.5rem; }
    h1 { font-family: 'Instrument Serif', serif; font-size: 2rem; font-weight: 400; letter-spacing: -0.02em; line-height: 1.15; margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 800px; display: block; }
    @media print { .diagram-container { overflow-x: visible; } svg { min-width: 0; } }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · pipelines.md</p>
    <h1>Nothing runs until asked</h1>
    <div class="diagram-container">
      <svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="pipelines-demand-title pipelines-demand-desc">
        <title id="pipelines-demand-title">Nothing runs until asked</title>
        <desc id="pipelines-demand-desc">A source, a filter and a mapper are algorithms, each one's input connected to the output port of the one before; the mapper's actor, its renderer and the render window follow. Output flows downstream, but only when Update() on an algorithm, or Render() on the window, sends a request upstream; each algorithm then runs only if it, or one before it, changed since its last run.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
        </defs>
        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- Zone first: the algorithms, connected port to input. -->
        <rect x="40" y="40" width="176" height="300" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <g font-family="'Geist Mono', monospace" font-size="8" fill="#5a6580" letter-spacing="0.14em">
          <text x="56" y="58">ALGORITHMS</text>
          <text x="56" y="69">OUTPUT PORT TO INPUT</text>
        </g>

        <!-- Output: down the pipeline, on along the scene. -->
        <g fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)">
          <path d="M104,132 V178"/>
          <path d="M104,228 V274"/>
          <path d="M200,308 H246"/>
          <path d="M392,308 H430"/>
          <path d="M576,308 H614"/>
        </g>

        <!-- Requests: from the call back up to the source. -->
        <g fill="none" stroke="#bf4520" stroke-width="1.2" marker-end="url(#arrow-accent)">
          <path d="M688,224 V274"/>
          <path d="M616,292 H578"/>
          <path d="M432,292 H394"/>
          <path d="M248,292 H202"/>
          <path d="M152,276 V230"/>
          <path d="M152,180 V134"/>
          <path d="M296,204 H202"/>
        </g>
        <circle cx="688" cy="220" r="4" fill="#bf4520"/>
        <circle cx="300" cy="204" r="4" fill="#bf4520"/>

        <!-- The calls that ask. -->
        <g font-family="'Geist Mono', monospace" font-size="8" fill="#bf4520" letter-spacing="0.06em">
          <rect x="230" y="186" width="52" height="12" rx="2" fill="#f5f5f5"/>
          <text x="256" y="195" text-anchor="middle">Update()</text>
          <rect x="696" y="240" width="52" height="12" rx="2" fill="#f5f5f5"/>
          <text x="700" y="249">Render()</text>
        </g>

        <!-- Callout: what runs. -->
        <path d="M244,104 Q224,108 202,108" fill="none" stroke="rgba(45,49,66,0.40)" stroke-width="1" stroke-dasharray="4,3"/>
        <circle cx="201" cy="108" r="2" fill="#2d3142"/>
        <g font-family="'Instrument Serif', serif" font-size="14" font-style="italic" fill="#2d3142">
          <text x="248" y="104">each runs only if it, or one before it,</text>
          <text x="248" y="121">changed (Modified) since its last run</text>
        </g>

        <!-- The algorithms. -->
        <g font-family="'Geist', sans-serif" text-anchor="middle">
          <rect x="56" y="84" width="144" height="48" rx="6" fill="#ffffff" stroke="#2d3142"/>
          <text x="128" y="104" fill="#2d3142" font-size="12" font-weight="600">source</text>
          <text x="128" y="119" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">vtkSphereSource</text>

          <rect x="56" y="180" width="144" height="48" rx="6" fill="#ffffff" stroke="#2d3142"/>
          <text x="128" y="200" fill="#2d3142" font-size="12" font-weight="600">filter</text>
          <text x="128" y="215" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">vtkShrinkFilter</text>

          <rect x="56" y="276" width="144" height="48" rx="6" fill="#ffffff" stroke="#2d3142"/>
          <text x="128" y="296" fill="#2d3142" font-size="12" font-weight="600">mapper</text>
          <text x="128" y="311" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">vtkPolyDataMapper</text>
        </g>

        <!-- The scene, which draws the mapper's output. -->
        <g font-family="'Geist', sans-serif" text-anchor="middle">
          <rect x="248" y="276" width="144" height="48" rx="6" fill="#f5f5f5"/>
          <rect x="248" y="276" width="144" height="48" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75"/>
          <text x="320" y="296" fill="#2d3142" font-size="12" font-weight="600">actor</text>
          <text x="320" y="311" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">vtkActor</text>

          <rect x="432" y="276" width="144" height="48" rx="6" fill="#f5f5f5"/>
          <rect x="432" y="276" width="144" height="48" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75"/>
          <text x="504" y="296" fill="#2d3142" font-size="12" font-weight="600">renderer</text>
          <text x="504" y="311" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">vtkRenderer</text>

          <rect x="616" y="276" width="144" height="48" rx="6" fill="#f5f5f5"/>
          <rect x="616" y="276" width="144" height="48" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75"/>
          <text x="688" y="296" fill="#2d3142" font-size="12" font-weight="600">render window</text>
          <text x="688" y="311" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">vtkRenderWindow</text>
        </g>

        <!-- Legend. -->
        <g font-family="'Geist Mono', monospace" font-size="8" fill="#5a6580" letter-spacing="0.14em">
          <line x1="40" y1="372" x2="64" y2="372" stroke="#bf4520" stroke-width="1.2"/>
          <text x="72" y="375">REQUEST, UPSTREAM</text>
          <line x1="216" y1="372" x2="240" y2="372" stroke="#4f5d75" stroke-width="1.2"/>
          <text x="248" y="375">OUTPUT, DOWNSTREAM</text>
          <circle cx="404" cy="372" r="4" fill="#bf4520"/>
          <text x="416" y="375">A CALL IN YOUR CODE</text>
        </g>
      </svg>
    </div>
  </div>
</body>
</html>
