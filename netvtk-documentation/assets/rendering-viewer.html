<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A VTK view in an application's window</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Geist', system-ui, sans-serif; background: #f5f5f5; color: #2d3142; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow { font-family: 'Geist Mono', ui-monospace, monospace; font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: #4f5d75; margin-bottom: 0.5rem; }
    h1 { font-family: 'Instrument Serif', serif; font-size: 2rem; font-weight: 400; letter-spacing: -0.02em; line-height: 1.15; margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 800px; display: block; }
    @media print { .diagram-container { overflow-x: visible; } svg { min-width: 0; } }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · rendering.md</p>
    <h1>A VTK view in an application's window</h1>
    <div class="diagram-container">
      <svg viewBox="0 0 800 476" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="rendering-viewer-title rendering-viewer-desc">
        <title id="rendering-viewer-title">A VTK view in an application's window</title>
        <desc id="rendering-viewer-desc">The UI framework's host (WPF's HwndHost, Avalonia's NativeControlHost) holds a child window; vtkRenderWindow draws into it, holding a vtkRenderer with actors and a camera; the window's messages go through C# to the render window (size, paint) and to a vtkGenericRenderWindowInteractor (mouse, size), whose vtkInteractorStyleTrackballCamera moves the camera and renders again.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        </defs>
        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- Zone first: the UI framework's host control. -->
        <rect x="40" y="40" width="720" height="100" rx="8" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.12)"/>
        <text x="60" y="60" fill="#5a6580" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">UI FRAMEWORK'S HOST</text>
        <text x="192" y="60" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">WPF HwndHost · Avalonia NativeControlHost</text>

        <!-- Containers before the connectors, which cross their borders: render window > renderer, interactor. -->
        <g font-family="'Geist', sans-serif" text-anchor="middle">
          <rect x="40" y="196" width="312" height="216" rx="6" fill="#ffffff" stroke="#2d3142"/>
          <text x="196" y="220" fill="#2d3142" font-size="12" font-weight="600">vtkRenderWindow</text>
          <text x="196" y="236" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">draws with OpenGL</text>

          <rect x="56" y="260" width="280" height="136" rx="6" fill="#ffffff" stroke="#2d3142"/>
          <text x="196" y="284" fill="#2d3142" font-size="12" font-weight="600">vtkRenderer</text>
          <text x="196" y="300" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">AddActor(), GetActiveCamera()</text>

          <rect x="448" y="288" width="312" height="108" rx="6" fill="#ffffff" stroke="#2d3142"/>
          <text x="604" y="312" fill="#2d3142" font-size="12" font-weight="600">vtkGenericRenderWindowInteractor</text>
        </g>

        <!-- Connectors. -->
        <g fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)">
          <path d="M196,196 V126"/>
          <path d="M604,124 V194"/>
          <path d="M448,222 H354"/>
          <path d="M604,248 V286"/>
          <path d="M464,354 H322"/>
        </g>

        <!-- Labels: beside the vertical segments, above the horizontal ones, in open canvas. -->
        <g fill="#f5f5f5">
          <rect x="204" y="162" width="64" height="12" rx="2"/>
          <rect x="612" y="162" width="52" height="12" rx="2"/>
          <rect x="366" y="202" width="68" height="12" rx="2"/>
          <rect x="612" y="262" width="68" height="12" rx="2"/>
          <rect x="360" y="322" width="80" height="24" rx="2"/>
        </g>
        <g font-family="'Geist Mono', monospace" font-size="8" fill="#5a6580" letter-spacing="0.06em">
          <text x="208" y="171">DRAWS INTO</text>
          <text x="616" y="171">MESSAGES</text>
          <text x="400" y="211" text-anchor="middle">SIZE, PAINT</text>
          <text x="616" y="271">MOUSE, SIZE</text>
          <text x="400" y="331" text-anchor="middle">MOVES IT,</text>
          <text x="400" y="342" text-anchor="middle">RENDERS AGAIN</text>
        </g>

        <g font-family="'Geist', sans-serif" text-anchor="middle">
          <!-- The child window (focal): where VTK draws and the messages come from. -->
          <rect x="64" y="72" width="672" height="52" rx="6" fill="#f5f5f5"/>
          <rect x="64" y="72" width="672" height="52" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520"/>
          <text x="400" y="94" fill="#2d3142" font-size="12" font-weight="600">child window</text>
          <text x="400" y="110" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">Windows: the application's, its class with CS_OWNDC · Linux: an X11 child VTK creates</text>

          <!-- The application's C#: its procedure passes the messages on. -->
          <rect x="448" y="196" width="312" height="52" rx="6" fill="#f5f5f5"/>
          <rect x="448" y="196" width="312" height="52" rx="6" fill="rgba(79,93,117,0.10)" stroke="#5a6580"/>
          <text x="604" y="218" fill="#2d3142" font-size="12" font-weight="600">window procedure, in C#</text>
          <text x="604" y="234" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">Linux: X events, read on a UI timer</text>

          <!-- What the renderer holds. -->
          <rect x="72" y="328" width="116" height="52" rx="6" fill="#ffffff" stroke="#2d3142"/>
          <text x="130" y="350" fill="#2d3142" font-size="12" font-weight="600">actors</text>
          <text x="130" y="366" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">vtkActor</text>
          <rect x="204" y="328" width="116" height="52" rx="6" fill="#ffffff" stroke="#2d3142"/>
          <text x="262" y="350" fill="#2d3142" font-size="12" font-weight="600">camera</text>
          <text x="262" y="366" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">vtkCamera</text>

          <!-- The interactor's style. -->
          <rect x="464" y="328" width="280" height="52" rx="6" fill="#ffffff" stroke="#2d3142"/>
          <text x="604" y="350" fill="#2d3142" font-size="12" font-weight="600">vtkInteractorStyleTrackballCamera</text>
          <text x="604" y="366" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">rotate, pan, zoom</text>
        </g>

        <text x="40" y="444" fill="#5a6580" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">VTK'S OWN WINDOW PROCEDURE STAYS OUT: THE MESSAGES GO THROUGH C#</text>
      </svg>
    </div>
  </div>
</body>
</html>
