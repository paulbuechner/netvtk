<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 800 568" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="readme-architecture-title readme-architecture-desc" width="800" height="568">
        <title id="readme-architecture-title">netvtk-gen's passes</title>
        <desc id="readme-architecture-desc">Parse reads VTK's install (headers, module properties, DLLs) and config/modules.yaml, Map adds the types netvtk-core's hand-written .i files provide, and Emit writes netvtk-core's wrapper .i files and module headers and the skip logs.</desc>
        <defs><style>@font-face{font-family:'Geist';font-weight:600;font-style:normal;src:url(data:font/woff;base64,) format('woff')}
@font-face{font-family:'Geist Mono';font-weight:400;font-style:normal;src:url(data:font/woff;base64,) format('woff')}</style><clipPath id="netvtk-card"><rect width="800" height="568" rx="12"/></clipPath>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        </defs><g clip-path="url(#netvtk-card)">
        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- Zones, left to right, each starting where its first node sits. -->
        <g fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8">
          <rect x="40" y="40" width="200" height="280" rx="8"/>
          <rect x="316" y="40" width="176" height="360" rx="8"/>
          <rect x="560" y="228" width="200" height="248" rx="8"/>
        </g>
        <g fill="#5a6580" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">
          <text x="56" y="57">INPUTS</text>
          <text x="332" y="57">NETVTK-GEN</text>
          <text x="576" y="245">OUTPUTS</text>
        </g>

        <!-- Connectors first. -->
        <g fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)">
          <path d="M224,104 H331"/>
          <path d="M224,184 H331"/>
          <path d="M224,272 H331"/>
          <path d="M404,208 V239"/>
          <path d="M404,304 V335"/>
          <path d="M476,348 H516 Q524,348 524,340 V292 Q524,284 532,284 H575"/>
          <path d="M476,360 H575"/>
          <path d="M476,372 H516 Q524,372 524,380 V428 Q524,436 532,436 H575"/>
        </g>
        <g font-family="'Geist Mono', monospace" font-size="8" fill="#5a6580" letter-spacing="0.06em">
          <rect x="246" y="252" width="64" height="12" rx="2" fill="#f5f5f5"/>
          <text x="278" y="261" text-anchor="middle">THEIR TYPES</text>
        </g>

        <g font-family="'Geist', sans-serif" text-anchor="middle">
          <!-- Inputs. -->
          <rect x="56" y="72" width="168" height="64" rx="6" fill="#f5f5f5"/>
          <rect x="56" y="72" width="168" height="64" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)"/>
          <text x="140" y="94" fill="#2d3142" font-size="12" font-weight="600">VTK 9.7.1 install</text>
          <text x="140" y="110" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">headers + DLLs,</text>
          <text x="140" y="122" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">module properties</text>

          <rect x="56" y="160" width="168" height="48" rx="6" fill="#f5f5f5"/>
          <rect x="56" y="160" width="168" height="48" rx="6" fill="#ffffff" stroke="#2d3142"/>
          <text x="140" y="188" fill="#2d3142" font-size="12" font-weight="600">config/modules.yaml</text>

          <rect x="56" y="240" width="168" height="64" rx="6" fill="#f5f5f5"/>
          <rect x="56" y="240" width="168" height="64" rx="6" fill="#ffffff" stroke="#2d3142"/>
          <text x="140" y="268" fill="#2d3142" font-size="12" font-weight="600">netvtk-core</text>
          <text x="140" y="283" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">hand-written .i</text>

          <!-- The three passes. -->
          <rect x="332" y="72" width="144" height="136" rx="6" fill="#f5f5f5"/>
          <rect x="332" y="72" width="144" height="136" rx="6" fill="#ffffff" stroke="#2d3142"/>
          <text x="404" y="136" fill="#2d3142" font-size="12" font-weight="600">Parse</text>
          <text x="404" y="151" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">ClangSharp/libclang</text>

          <rect x="332" y="240" width="144" height="64" rx="6" fill="#f5f5f5"/>
          <rect x="332" y="240" width="144" height="64" rx="6" fill="#ffffff" stroke="#2d3142"/>
          <text x="404" y="262" fill="#2d3142" font-size="12" font-weight="600">Map</text>
          <text x="404" y="278" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">TypeRegistry,</text>
          <text x="404" y="290" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">SignatureMapper</text>

          <rect x="332" y="336" width="144" height="48" rx="6" fill="#f5f5f5"/>
          <rect x="332" y="336" width="144" height="48" rx="6" fill="#ffffff" stroke="#2d3142"/>
          <text x="404" y="356" fill="#2d3142" font-size="12" font-weight="600">Emit</text>
          <text x="404" y="371" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">InterfaceWriter</text>

          <!-- Outputs. -->
          <rect x="576" y="260" width="168" height="48" rx="6" fill="#f5f5f5"/>
          <rect x="576" y="260" width="168" height="48" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75"/>
          <text x="660" y="280" fill="#2d3142" font-size="12" font-weight="600">netvtk-core</text>
          <text x="660" y="295" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">src/SWIG_files/wrapper/*.i</text>

          <rect x="576" y="328" width="168" height="64" rx="6" fill="#f5f5f5"/>
          <rect x="576" y="328" width="168" height="64" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75"/>
          <text x="660" y="350" fill="#2d3142" font-size="12" font-weight="600">netvtk-core</text>
          <text x="660" y="366" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">src/SWIG_files/headers/</text>
          <text x="660" y="378" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">*_module.hxx</text>

          <rect x="576" y="412" width="168" height="48" rx="6" fill="#f5f5f5"/>
          <rect x="576" y="412" width="168" height="48" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75"/>
          <text x="660" y="440" fill="#2d3142" font-size="12" font-weight="600">log/skips/*.txt</text>
        </g>

        <!-- Legend: the two fills that need decoding. -->
        <line x1="40" y1="500" x2="760" y2="500" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <g font-family="'Geist Mono', monospace" font-size="8" fill="#5a6580" letter-spacing="0.14em">
          <text x="40" y="528">LEGEND</text>
          <rect x="120" y="518" width="20" height="12" rx="2" fill="rgba(45,49,66,0.05)" stroke="#4f5d75"/>
          <text x="148" y="528">GENERATED</text>
          <rect x="248" y="518" width="20" height="12" rx="2" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)"/>
          <text x="276" y="528">FROM VTK</text>
        </g>
      </g></svg>
